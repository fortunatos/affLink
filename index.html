<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Age Verification</title>

  <!-- Hash Title -->

  <script>
    var hash = window.location.hash;

    if (hash.length > 0) {
      hash = hash.substring(1);

      var cleanHash = hash.replace(/[^a-zA-Z0-9\s]/g, '-');
      cleanHash = cleanHash.replace(/\s+/g, '-');

      document.title = 'TrutMeet:'+cleanHash;
    }
  </script>


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1TXQKQDHF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-K1TXQKQDHF');
</script>


  <style>

    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* PAGE
       Não usamos flex diretamente no body.
       Isso evita o deslocamento no navegador interno do X.
    */
    .page {
      width: 100%;
      min-width: 0;
      max-width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 20px;
    }

    /* BACKGROUND */
    .bg {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at top left,
          #ff4d6720,
          transparent 30%
        ),
        radial-gradient(
          circle at bottom right,
          #7c3aed20,
          transparent 30%
        ),
        #0b0b0b;

      z-index: -1;
      pointer-events: none;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 420px;
      min-width: 0;

      background: #121212;

      border: 1px solid #262626;
      border-radius: 24px;

      padding: 40px 30px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    /* ICON */
    .icon {
      font-size: 58px;
      line-height: 1;

      margin-bottom: 20px;
    }

    /* TITLE */
    h1 {
      font-size: 2rem;
      line-height: 1.2;

      margin-bottom: 15px;
    }

    /* TEXT */
    p {
      color: #b3b3b3;

      line-height: 1.7;

      margin-bottom: 30px;
    }

    /* BUTTON CONTAINER */
    .buttons {
      width: 100%;
      min-width: 0;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }

    /* BUTTON */
    .btn {
      display: block;

      width: 100%;
      min-width: 0;

      padding: 16px;

      border-radius: 14px;

      text-decoration: none;
      text-align: center;

      font-weight: bold;

      transition: .25s ease;
    }

    /* ENTER */
    .enter {
      background: linear-gradient(
        90deg,
        #ff4d67,
        #ff758c
      );

      color: white;

      box-shadow:
        0 10px 30px rgba(255, 77, 103, .25);
    }

    .enter:hover {
      transform: translateY(-2px);
    }

    /* EXIT */
    .exit {
      background: #1d1d1d;

      border: 1px solid #333;

      color: #ccc;
    }

    /* FOOTER */
    .footer {
      margin-top: 25px;

      color: #666;

      font-size: .85rem;

      line-height: 1.5;
    }

    /* CELULAR */
    @media (max-width: 480px) {

      .page {
        padding: 15px;
      }

      .card {
        padding: 32px 22px;
        border-radius: 20px;
      }

      .icon {
        font-size: 52px;
      }

      h1 {
        font-size: 1.7rem;
      }

    }

  </style>

</head>

<body>

  <div class="bg"></div>

  <div class="page">

    <main class="card">

      <div class="icon">
        🔞
      </div>

      <h1>
        Age Verification
      </h1>

      <p>
        You must be 18 years or older to access this website.
        Please confirm your age before continuing.
      </p>

      <div class="buttons">

        <a href="https://t.datsk3.com/133199/10377/0?aff_sub5=SF_006OG000004lmDN" class="btn enter">
          I Am 18+ Continue
        </a>

        <a href="https://t.datsk3.com/133199/9986/0?aff_sub5=SF_006OG000004lmDN" class="btn exit">
          Exit
        </a>

      </div>

      <div class="footer">
        By continuing, you confirm that you meet the legal age requirements.
      </div>

    </main>

  </div>

</body>

</html>
